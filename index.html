<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7ff">
<title>One Test Portal | KCET</title>
<style>
:root{
 --bg:#f4f6ff;--ink:#17213b;--muted:#69748d;--panel:#fff;--line:#e8eaf4;
 --shadow:0 14px 38px rgba(37,48,92,.10);--nav:#fff;
}
[data-theme="dark"]{
 --bg:#101426;--ink:#f3f5ff;--muted:#aab3ca;--panel:#1a2138;--line:#303954;
 --shadow:0 16px 40px rgba(0,0,0,.25);--nav:#171e33;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh;transition:.25s}
button,input{font:inherit}
.wrap{width:min(1200px,calc(100% - 36px));margin:auto}
header{position:relative;overflow:hidden;color:#fff;background:linear-gradient(115deg,#4934c9 0%,#7654e8 45%,#ed4b9b 100%);padding:24px 0 72px}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
header:before{width:340px;height:340px;right:8%;top:-230px}
header:after{width:220px;height:220px;right:32%;bottom:-175px}
.nav{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.5px}
.logo{width:45px;height:45px;border-radius:15px;background:#fff;color:#6545dc;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 20px #2a1b7c55}
.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:700;opacity:.8;margin-top:4px}
.theme{border:1px solid #ffffff66;background:#ffffff20;color:#fff;border-radius:13px;width:42px;height:42px;font-size:19px;cursor:pointer}
.hero{position:relative;z-index:1;text-align:center;padding:58px 0 0}
.tag{display:inline-block;background:#ffffff20;border:1px solid #ffffff55;border-radius:99px;padding:8px 14px;font-size:11px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(36px,6vw,62px);line-height:1.05;letter-spacing:-2px;margin:20px 0 12px}
.hero p{max-width:650px;margin:0 auto;color:#f2edff;font-size:15px;line-height:1.7}
main{padding:0 0 54px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:30px 0 20px}
.searchbox{position:relative;max-width:440px;width:100%}
.searchbox span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:19px}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0 15px 0 43px;outline:none;box-shadow:var(--shadow)}
input:focus{border-color:#7860e8;box-shadow:0 0 0 4px #7860e822}
.counter{color:var(--muted);font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{--tone:#6855e8;position:relative;isolation:isolate;overflow:hidden;min-height:226px;border-radius:21px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:23px;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .25s,box-shadow .25s,border-color .25s;animation:appear .55s both}
.card:before{content:"";position:absolute;z-index:-1;width:150px;height:150px;right:-70px;top:-75px;border-radius:50%;background:var(--tone);opacity:.12;transition:.3s}
.card:hover{transform:translateY(-7px);border-color:var(--tone);box-shadow:0 20px 45px color-mix(in srgb,var(--tone) 20%,transparent)}
.card:hover:before{transform:scale(1.45);opacity:.2}
.cardhead{display:flex;align-items:center;justify-content:space-between}
.appicon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:27px;color:white;background:linear-gradient(140deg,var(--tone),var(--tone2));box-shadow:0 9px 20px color-mix(in srgb,var(--tone) 28%,transparent)}
.category{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--tone);background:color-mix(in srgb,var(--tone) 11%,transparent);padding:7px 10px;border-radius:99px}
.card h2{font-size:18px;margin:19px 0 8px;letter-spacing:-.3px}
.card p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 18px}
.open{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--tone)}
.arrow{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--tone) 12%,transparent);display:grid;place-items:center;font-size:18px;transition:.2s}
.card:hover .arrow{background:var(--tone);color:#fff;transform:translateX(3px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:55px 15px;background:var(--panel);border:1px dashed var(--line);border-radius:18px}
footer{border-top:1px solid var(--line);padding:22px 0 28px;text-align:center;color:var(--muted);font-size:11px}
footer b{color:var(--ink)}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){
 .wrap{width:calc(100% - 26px)}header{padding-bottom:55px}.hero{padding-top:45px}h1{letter-spacing:-1.3px}
 .hero p{font-size:13px}.tools{align-items:stretch;flex-direction:column;margin-top:23px}.searchbox{max-width:none}
 .grid{grid-template-columns:1fr;gap:14px}.card{min-height:205px;padding:20px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <nav class="nav">
   <div class="brand"><div class="logo">✦</div><div>ONE TEST PORTAL<small>UNIFIED ASSESSMENT HUB</small></div></div>
   <button class="theme" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">☾</button>
  </nav>
  <section class="hero">
   <span class="tag">✦ One platform · All your tools</span>
   <h1>Welcome to <span style="color:#ffe36e">One Test Portal</span></h1>
   <p>Access your examination, learning and assessment applications from one place. Select a portal below to get started.</p>
  </section>
 </div>
</header>
<main class="wrap">
 <div class="tools">
  <div class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Search a portal..." autocomplete="off"></div>
  <div class="counter" id="counter"></div>
 </div>
 <section class="grid" id="grid" aria-label="Portal list"></section>
</main>
<footer><div class="wrap">© <span id="year"></span> <b>One Test Portal</b> · Unified Assessment Hub</div></footer>
<script>
/*
  LOCAL PAGE LINKS:
  Keep index.html and all portal HTML files in the SAME folder.
  Change each file value below to the exact filename in your project.
  Example: file: "examduty.html" opens that page in the SAME TAB.
*/
const portals = [
 {title:"Exam Duty Allotment & Tracker",desc:"View and manage examination duty allotment details.",icon:"📋",category:"Exam Cell",file:"examduty.html",tone:"#6754e8",tone2:"#9a68f5"},
 {title:"Teaching Learning Tracking",desc:"Teaching Learning Process Audit Platform",icon:"🔢",category:"Exam Cell",file:"TLV_Platform/index.html",tone:"#078cce",tone2:"#39c6e8"},
 {title:"K-Map Learning & Assessment",desc:"Learn Karnaugh maps and practise SOP and POS simplification.",icon:"🧩",category:"Learning",file:"kmap.html",tone:"#e34d91",tone2:"#ff8caa"},
 {title:"SkillSense Assessment",desc:"Access competency assessments, coding tests and performance reports.",icon:"🎯",category:"Assessment",file:"skillsense.html",tone:"#e58b18",tone2:"#ffc34f"},
 {title:"Question Paper Generator",desc:"Prepare question papers with CO and Bloom’s taxonomy mapping.",icon:"📄",category:"Faculty Tools",file:"questionpaper.html",tone:"#159b73",tone2:"#52d6a1"},
 {title:"Professional Elective Selection",desc:"View elective courses and complete the course selection process.",icon:"🎓",category:"Student Services",file:"elective.html",tone:"#bd50d5",tone2:"#ed83d4"}
];
const grid=document.getElementById("grid"), search=document.getElementById("search"), counter=document.getElementById("counter");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(q=""){
 const list=portals.filter(p=>(p.title+" "+p.desc+" "+p.category).toLowerCase().includes(q.toLowerCase()));
 counter.textContent=`${list.length} PORTAL${list.length===1?"":"S"} AVAILABLE`;
 if(!list.length){grid.innerHTML='<div class="empty">No matching portal found. Try another search.</div>';return;}
 grid.innerHTML=list.map((p,i)=>`
 <a class="card" href="${esc(p.file)}" style="--tone:${p.tone};--tone2:${p.tone2};animation-delay:${i*70}ms" aria-label="Open ${esc(p.title)}">
  <div class="cardhead"><div class="appicon">${p.icon}</div><span class="category">${esc(p.category)}</span></div>
  <h2>${esc(p.title)}</h2><p>${esc(p.desc)}</p>
  <div class="open"><span>OPEN PORTAL</span><span class="arrow">→</span></div>
 </a>`).join("");
}
search.addEventListener("input",e=>render(e.target.value));
const themeBtn=document.getElementById("themeBtn");
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==="dark"?"☼":"☾";try{localStorage.setItem("one-test-theme",t)}catch(e){}}
let initial="light";try{initial=localStorage.getItem("one-test-theme")||"light"}catch(e){}
setTheme(initial==="dark"?"dark":"light");
themeBtn.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
document.getElementById("year").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
